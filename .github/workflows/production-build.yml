name: Relay Production Build

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/production-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-production-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://resonantrelay.org

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Release safety checks
        run: npm run release-check

      - name: Build production static site
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-production-static-${{ github.sha }}
          path: relay/out
          if-no-files-found: error
          retention-days: 14
