name: Deploy Relay Beta to GitHub Pages

# Beta branch publishes to GitHub Pages; main stays production on Render.
on:
  push:
    branches: [beta]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

env:
  NEXT_PUBLIC_RELAY_DEPLOY_TARGET: github-pages
  NEXT_PUBLIC_SITE_URL: https://link9060.github.io/Resonant-Relay

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-beta
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static beta site
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: relay/out

  deploy:
    environment:
      # Keep beta separate from GitHub's default github-pages environment,
      # which may be protected to allow only the default branch.
      name: github-pages-beta
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy beta to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
