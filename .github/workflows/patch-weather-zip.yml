name: Patch Relay weather ZIP

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/patch-weather-zip.yml'

permissions:
  contents: write

jobs:
  patch-weather:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RELAY_DEPLOY_TARGET: github-pages
      NEXT_PUBLIC_SITE_URL: https://link9060.github.io/Resonant-Relay
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Patch weather widget
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('relay/src/components/dashboard/dashboard-page.tsx')
          text = path.read_text()

          def swap(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)

          swap("""type WeatherSnapshot = {
            temperature: number;
            apparent: number;
            weatherCode: number;
            high: number;
            low: number;
            precip: number;
            sunrise: string;
            sunset: string;
            unit: string;
            fetchedAt: string;
          };

          const WEATHER_CACHE_KEY = 'relay-dashboard-weather-v1';
          const QUICK_NOTE_KEY = 'relay-dashboard-quick-note-v1';""", """type WeatherSnapshot = {
            temperature: number;
            apparent: number;
            weatherCode: number;
            high: number;
            low: number;
            precip: number;
            sunrise: string;
            sunset: string;
            unit: string;
            fetchedAt: string;
            zipCode: string;
            locationLabel: string;
          };

          const WEATHER_CACHE_KEY = 'relay-dashboard-weather-v2';
          const WEATHER_ZIP_KEY = 'relay-dashboard-weather-zip-v1';
          const QUICK_NOTE_KEY = 'relay-dashboard-quick-note-v1';""", 'weather snapshot')

          swap("""    const parsed = JSON.parse(raw) as WeatherSnapshot;
              if (typeof parsed.temperature !== 'number') return null;
              const fetchedAt = new Date(parsed.fetchedAt);""", """    const parsed = JSON.parse(raw) as WeatherSnapshot;
              if (typeof parsed.temperature !== 'number' || !/^\\d{5}$/.test(parsed.zipCode ?? '')) return null;
              const fetchedAt = new Date(parsed.fetchedAt);""", 'weather cache validation')

          swap("""function readQuickNote() {
            if (typeof window === 'undefined') return '';
            try { return window.localStorage.getItem(QUICK_NOTE_KEY) ?? ''; } catch { return ''; }
          }""", """function readWeatherZip() {
            if (typeof window === 'undefined') return '';
            try { return (window.localStorage.getItem(WEATHER_ZIP_KEY) ?? '').replace(/\\D/g, '').slice(0, 5); } catch { return ''; }
          }

          function readQuickNote() {
            if (typeof window === 'undefined') return '';
            try { return window.localStorage.getItem(QUICK_NOTE_KEY) ?? ''; } catch { return ''; }
          }""", 'read weather zip')

          swap("""  const [weather, setWeather] = useState<WeatherSnapshot | null>(() => readCachedWeather());
            const [weatherBusy, setWeatherBusy] = useState(false);
            const [weatherMessage, setWeatherMessage] = useState<string | null>(null);
            const [quickNote, setQuickNote] = useState(() => readQuickNote());""", """  const [weather, setWeather] = useState<WeatherSnapshot | null>(() => readCachedWeather());
            const [weatherBusy, setWeatherBusy] = useState(false);
            const [weatherMessage, setWeatherMessage] = useState<string | null>(null);
            const [weatherZip, setWeatherZip] = useState(() => readWeatherZip());
            const [weatherZipDraft, setWeatherZipDraft] = useState(() => readWeatherZip());
            const [quickNote, setQuickNote] = useState(() => readQuickNote());""", 'weather state')

          old_weather = """  function loadWeather() {
            if (!navigator.geolocation) return setWeatherMessage('Location is not available in this browser.');
            setWeatherBusy(true);
            setWeatherMessage(null);
            navigator.geolocation.getCurrentPosition(async (position) => {
              try {
                const useFahrenheit = navigator.language.toLowerCase().includes('us');
                const params = new URLSearchParams({
                  latitude: String(position.coords.latitude),
                  longitude: String(position.coords.longitude),
                  current: 'temperature_2m,apparent_temperature,weather_code',
                  daily: 'temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset',
                  timezone: 'auto',
                  forecast_days: '1',
                  temperature_unit: useFahrenheit ? 'fahrenheit' : 'celsius',
                });
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
                if (!response.ok) throw new Error('Weather request failed');
                const data = await response.json();
                const next: WeatherSnapshot = {
                  temperature: Number(data.current?.temperature_2m ?? 0),
                  apparent: Number(data.current?.apparent_temperature ?? 0),
                  weatherCode: Number(data.current?.weather_code ?? 0),
                  high: Number(data.daily?.temperature_2m_max?.[0] ?? 0),
                  low: Number(data.daily?.temperature_2m_min?.[0] ?? 0),
                  precip: Number(data.daily?.precipitation_probability_max?.[0] ?? 0),
                  sunrise: String(data.daily?.sunrise?.[0] ?? ''),
                  sunset: String(data.daily?.sunset?.[0] ?? ''),
                  unit: String(data.current_units?.temperature_2m ?? (useFahrenheit ? '°F' : '°C')),
                  fetchedAt: new Date().toISOString(),
                };
                setWeather(next);
                try { window.localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(next)); } catch {}
              } catch {
                setWeatherMessage('Weather could not load right now.');
              } finally {
                setWeatherBusy(false);
              }
            }, () => {
              setWeatherBusy(false);
              setWeatherMessage('Allow location to show local weather.');
            }, { enableHighAccuracy: false, timeout: 10_000, maximumAge: 15 * 60_000 });
          }"""

          new_weather = """  const loadWeather = useCallback(async (zipOverride?: string) => {
            const zip = String(zipOverride ?? weatherZip).replace(/\\D/g, '').slice(0, 5);
            if (!/^\\d{5}$/.test(zip)) {
              setWeatherMessage('Enter a 5-digit ZIP code.');
              return;
            }

            setWeatherBusy(true);
            setWeatherMessage(null);
            try {
              const zipResponse = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip)}`);
              if (zipResponse.status === 404) throw new Error('ZIP_NOT_FOUND');
              if (!zipResponse.ok) throw new Error('ZIP_LOOKUP_FAILED');
              const zipData = await zipResponse.json() as { places?: Array<{ latitude?: string; longitude?: string; 'place name'?: string; 'state abbreviation'?: string }> };
              const place = zipData.places?.[0];
              const latitude = Number(place?.latitude);
              const longitude = Number(place?.longitude);
              if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) throw new Error('ZIP_LOOKUP_FAILED');

              const useFahrenheit = navigator.language.toLowerCase().includes('us');
              const params = new URLSearchParams({
                latitude: String(latitude),
                longitude: String(longitude),
                current: 'temperature_2m,apparent_temperature,weather_code',
                daily: 'temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset',
                timezone: 'auto',
                forecast_days: '1',
                temperature_unit: useFahrenheit ? 'fahrenheit' : 'celsius',
              });
              const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
              if (!response.ok) throw new Error('WEATHER_REQUEST_FAILED');
              const data = await response.json();
              const placeName = place?.['place name']?.trim();
              const stateName = place?.['state abbreviation']?.trim();
              const next: WeatherSnapshot = {
                temperature: Number(data.current?.temperature_2m ?? 0),
                apparent: Number(data.current?.apparent_temperature ?? 0),
                weatherCode: Number(data.current?.weather_code ?? 0),
                high: Number(data.daily?.temperature_2m_max?.[0] ?? 0),
                low: Number(data.daily?.temperature_2m_min?.[0] ?? 0),
                precip: Number(data.daily?.precipitation_probability_max?.[0] ?? 0),
                sunrise: String(data.daily?.sunrise?.[0] ?? ''),
                sunset: String(data.daily?.sunset?.[0] ?? ''),
                unit: String(data.current_units?.temperature_2m ?? (useFahrenheit ? '°F' : '°C')),
                fetchedAt: new Date().toISOString(),
                zipCode: zip,
                locationLabel: placeName ? `${placeName}${stateName ? `, ${stateName}` : ''}` : `ZIP ${zip}`,
              };
              setWeather(next);
              setWeatherZip(zip);
              setWeatherZipDraft(zip);
              try {
                window.localStorage.setItem(WEATHER_ZIP_KEY, zip);
                window.localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(next));
              } catch {}
            } catch (error) {
              setWeatherMessage(error instanceof Error && error.message === 'ZIP_NOT_FOUND'
                ? 'That ZIP code was not found.'
                : 'Weather could not load right now.');
            } finally {
              setWeatherBusy(false);
            }
          }, [weatherZip]);

          useEffect(() => {
            if (!weather && /^\\d{5}$/.test(weatherZip)) void loadWeather(weatherZip);
          }, [loadWeather, weather, weatherZip]);

          function submitWeatherZip(event: FormEvent) {
            event.preventDefault();
            void loadWeather(weatherZipDraft);
          }"""
          swap(old_weather, new_weather, 'weather loader')

          old_widget = """      case 'weather':
                return <DashboardCard index={index} compact={compact} icon={<CloudSun size={18} />} title=\"Weather\">{weather ? <><div className=\"flex items-end justify-between gap-3\"><div><p className={`${compact ? 'text-2xl' : 'text-4xl'} font-display font-medium text-ink`}>{Math.round(weather.temperature)}{weather.unit}</p><p className=\"mt-1 text-sm text-ink-muted\">{weatherLabel(weather.weatherCode)}</p></div>{!compact && <div className=\"text-right text-xs text-ink-faint\"><p>Feels {Math.round(weather.apparent)}{weather.unit}</p><p className=\"mt-1\">H {Math.round(weather.high)}° · L {Math.round(weather.low)}°</p></div>}</div>{!compact && widget.rows >= 2 && <div className=\"mt-4 grid grid-cols-2 gap-2\"><MiniPanel label=\"Rain\" value={`${Math.round(weather.precip)}%`} detail=\"chance today\" /><MiniPanel label=\"Updated\" value={formatRelative(weather.fetchedAt)} detail=\"local weather\" /></div>}{widget.rows >= 2 && <button type=\"button\" onClick={loadWeather} className=\"mt-3 text-xs font-medium text-ink-muted hover:text-ink\">Refresh weather</button>}</> : <div className=\"rounded-xl bg-surface p-3\"><p className=\"text-sm text-ink-muted\">Use your location to show local weather.</p><button type=\"button\" onClick={loadWeather} disabled={weatherBusy} className=\"mt-3 rounded-lg bg-ink px-3 py-2 text-xs font-semibold text-canvas disabled:opacity-50\">{weatherBusy ? 'Loading…' : 'Use my location'}</button>{weatherMessage && !compact && <p className=\"mt-2 text-xs text-ink-faint\">{weatherMessage}</p>}</div>}</DashboardCard>;"""

          new_widget = """      case 'weather':
                return <DashboardCard index={index} compact={compact} icon={<CloudSun size={18} />} title=\"Weather\">{weather ? <><div className=\"flex items-end justify-between gap-3\"><div className=\"min-w-0\"><p className={`${compact ? 'text-2xl' : 'text-4xl'} font-display font-medium text-ink`}>{Math.round(weather.temperature)}{weather.unit}</p><p className=\"mt-1 truncate text-sm text-ink-muted\">{weatherLabel(weather.weatherCode)}</p><p className=\"mt-1 truncate text-[11px] text-ink-faint\">{weather.locationLabel} · {weather.zipCode}</p></div>{!compact && <div className=\"text-right text-xs text-ink-faint\"><p>Feels {Math.round(weather.apparent)}{weather.unit}</p><p className=\"mt-1\">H {Math.round(weather.high)}° · L {Math.round(weather.low)}°</p></div>}</div>{!compact && widget.rows >= 2 && <div className=\"mt-4 grid grid-cols-2 gap-2\"><MiniPanel label=\"Rain\" value={`${Math.round(weather.precip)}%`} detail=\"chance today\" /><MiniPanel label=\"Updated\" value={formatRelative(weather.fetchedAt)} detail={`ZIP ${weather.zipCode}`} /></div>}{widget.rows >= 2 && <div className=\"mt-3 flex flex-wrap gap-x-3 gap-y-2 text-xs font-medium\"><button type=\"button\" onClick={() => void loadWeather(weather.zipCode)} disabled={weatherBusy} className=\"text-ink-muted hover:text-ink disabled:opacity-50\">{weatherBusy ? 'Refreshing…' : 'Refresh weather'}</button><button type=\"button\" onClick={() => { setWeather(null); setWeatherMessage(null); setWeatherZipDraft(weather.zipCode); }} className=\"text-ink-faint hover:text-ink\">Change ZIP</button></div>}</> : <div className=\"rounded-xl bg-surface p-3\"><p className=\"text-sm text-ink-muted\">Enter a ZIP code for local weather. Relay will remember it on this device.</p><form onSubmit={submitWeatherZip} className=\"mt-3 flex gap-2\"><input value={weatherZipDraft} onChange={(event) => { setWeatherZipDraft(event.target.value.replace(/\\D/g, '').slice(0, 5)); setWeatherMessage(null); }} inputMode=\"numeric\" autoComplete=\"postal-code\" pattern=\"[0-9]{5}\" maxLength={5} aria-label=\"Weather ZIP code\" placeholder=\"ZIP code\" className=\"min-w-0 flex-1 rounded-lg border border-border bg-canvas px-3 py-2 text-sm text-ink outline-none placeholder:text-ink-faint\" /><button type=\"submit\" disabled={weatherBusy || weatherZipDraft.length !== 5} className=\"shrink-0 rounded-lg bg-ink px-3 py-2 text-xs font-semibold text-canvas disabled:opacity-50\">{weatherBusy ? 'Loading…' : 'Load'}</button></form>{weatherMessage && <p className=\"mt-2 text-xs text-ink-faint\">{weatherMessage}</p>}</div>}</DashboardCard>;"""
          swap(old_widget, new_widget, 'weather widget')

          text = text.replace('<EmptyState>Enable Weather first.</EmptyState>', '<EmptyState>Set a Weather ZIP first.</EmptyState>', 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: relay
        run: npm ci
      - name: Lint
        working-directory: relay
        run: npm run lint
      - name: Build static beta site
        working-directory: relay
        run: npm run build
      - name: Commit weather ZIP update
        run: |
          git config user.name "Link9060"
          git config user.email "153758512+Link9060@users.noreply.github.com"
          git add relay/src/components/dashboard/dashboard-page.tsx
          git commit -m "Use ZIP codes for Relay weather"
          git push origin HEAD:beta
