name: Relay CI

on:
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:motion
      - run: npm run typecheck
      - run: npm run build


  beta-package:
    if: github.event_name == 'pull_request' && (github.base_ref == 'beta' || (github.base_ref == 'review/integrated-arrow-beta-ui-20261110' && github.head_ref == 'improve/arrow-integrated-beta'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      NEXT_PUBLIC_RELAY_DEPLOY_TARGET: github-pages
      NEXT_PUBLIC_SITE_URL: https://link9060.github.io/Resonant-Relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - name: Verify integrated ARROW beta target and module pins
        run: npm run beta:target
      - run: node scripts/build-arrow-beta.mjs
      - name: Verify CSS integrity rejects tampering
        shell: bash
        run: |
          set -euo pipefail
          css=out/arrow/arrow-shell.css
          backup=$(mktemp)
          log=$(mktemp)
          cp "$css" "$backup"
          trap 'cp "$backup" "$css"; rm -f "$backup" "$log"' EXIT
          printf '\n/* integrity-negative-test */\n' >> "$css"
          if node scripts/validate-arrow-beta-assets.mjs >"$log" 2>&1; then
            echo "ERROR: modified CSS passed package validation"
            exit 1
          fi
          if ! grep -q 'Packaged shell CSS checksum does not match version.json' "$log"; then
            cat "$log"
            echo "ERROR: validator failed for an unexpected reason"
            exit 1
          fi
          cp "$backup" "$css"
          node scripts/validate-arrow-beta-assets.mjs
      - name: Verify JS integrity rejects tampering
        shell: bash
        run: |
          set -euo pipefail
          js=out/arrow/arrow-shell.js
          backup=$(mktemp)
          log=$(mktemp)
          cp "$js" "$backup"
          trap 'cp "$backup" "$js"; rm -f "$backup" "$log"' EXIT
          printf '\n/* integrity-negative-test */\n' >> "$js"
          if node scripts/validate-arrow-beta-assets.mjs >"$log" 2>&1; then
            echo "ERROR: modified JS passed package validation"
            exit 1
          fi
          if ! grep -q 'Packaged shell checksum does not match version.json' "$log"; then
            cat "$log"
            echo "ERROR: validator failed for an unexpected reason"
            exit 1
          fi
          cp "$backup" "$js"
          node scripts/validate-arrow-beta-assets.mjs
