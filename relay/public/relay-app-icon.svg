<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="relay-app-title">
  <title id="relay-app-title">Relay app icon</title>
  <defs>
    <linearGradient id="relay-silver" x1="90" y1="70" x2="422" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#d6d6d8"/>
      <stop offset="0.72" stop-color="#8f8f94"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <radialGradient id="relay-bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#202024"/>
      <stop offset="1" stop-color="#080809"/>
    </radialGradient>
    <path id="relay-app-blade" d="M256 86c66.8 0 124.1 37.9 152.5 93.4-41.9-20.1-85.7-21.2-124.3-3.1-32.9 15.4-57.7 42.1-70.2 75-16.9-41.3-13.9-82.5 7.3-118 10.1-17.1 22.1-31.2 34.7-47.3Z"/>
    <mask id="relay-app-cutout">
      <rect width="512" height="512" fill="black"/>
      <g fill="white">
        <use href="#relay-app-blade"/>
        <use href="#relay-app-blade" transform="rotate(60 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(120 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(180 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(240 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(300 256 256)"/>
      </g>
      <g fill="none" stroke="black" stroke-width="8" stroke-linejoin="round">
        <use href="#relay-app-blade"/>
        <use href="#relay-app-blade" transform="rotate(60 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(120 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(180 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(240 256 256)"/>
        <use href="#relay-app-blade" transform="rotate(300 256 256)"/>
      </g>
      <circle cx="256" cy="256" r="70" fill="black"/>
    </mask>
    <filter id="relay-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#relay-bg)"/>
  <rect width="512" height="512" fill="url(#relay-silver)" mask="url(#relay-app-cutout)" filter="url(#relay-shadow)"/>
</svg>
